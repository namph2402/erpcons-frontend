<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f9" />
    <title>ERPCons — Construction OS</title>
    <!--
      Áp theme TRƯỚC khi CSS và React chạy để không nháy nền trắng.
      Phải giữ đồng bộ với src/theme/theme.ts (khoá lưu + cách quy đổi).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('erpcons.theme') || 'system';
          var theme =
            saved === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : saved;
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#081220' : '#f5f7f9');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
